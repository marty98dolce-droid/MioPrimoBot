name: Esegui Bot di Trading

on:
  schedule:
    - cron: '0 * * * *' # Si attiva automaticamente ogni ora (puoi modificarlo)
  workflow_dispatch: # Ti permette anche di prenderlo a mano quando vuoi con un click

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi il codice dal repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esegui il bot
        run: python bot.py
